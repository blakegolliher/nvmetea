# cargo-deny configuration (CI job `deny`). Userspace is MIT; every dependency
# must be under a licence compatible with redistribution in MIT binaries and
# RPM/DEB packages. BPF objects (bpf/*.c, Dual MIT/GPL) are not crates.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# libbpf-sys is "LGPL-2.1-only OR BSD-2-Clause": BSD-2-Clause satisfies the
# expression, so no LGPL exception is needed.
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are reported for direct dependencies only; transitive
# ones (e.g. through ratatui) are tracked upstream.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
